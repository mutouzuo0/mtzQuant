[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtzquant"
version = "0.1.0"
description = "mtzQuant: local-first, event-driven quantitative backtesting framework (JoinQuant/PTrade compatible, CSV-based)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "mtzQuant" }]
keywords = ["quant", "backtest", "joinquant", "ptrade", "csv"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "pyarrow>=14.0",
    # M2-O 数据覆盖检查与去重合并（3.9/3.10, read_csv_auto + row_number 去重）
    "duckdb>=1.0",
    # M2-W0 提前自 M4 引入（Web 最小可视版; M4 不再重复配置）
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "import-linter>=2.0",
    "pre-commit>=3.6",
    "httpx>=0.27",  # W0 WS 测试（fastapi TestClient）
]
download = [
    "akshare>=1.12",
    "tushare>=1.4",
]
# M3-D1: 研究层可选依赖（ML 数据集构建用, 不进核心包）
research = [
    "scikit-learn>=1.3",
]

[project.scripts]
mtzquant = "mtzquant.cli:app"

[tool.setuptools.packages.find]
include = ["mtzquant*"]

# ============================================================
# pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not network and not m5_deferred'"
markers = [
    "slow: slow tests (performance budget / real-data end-to-end)",
    "network: requires internet access (akshare/tushare)",
    "m5_deferred: minute-level semantics deferred to milestone M5",
]
# Q 验收: `pytest -W error` 全绿——仅忽略第三方 starlette 弃用告警（非本项目代码）
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ============================================================
# ruff (lint + format)
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# UP009: 取消"# coding:utf-8 声明多余"告警——项目约定文件头必须带该声明（木头左编码规范）
ignore = ["UP009"]

[tool.ruff.lint.isort]
known-first-party = ["mtzquant"]

# ============================================================
# mypy (宽松档)
# ============================================================
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

# ============================================================
# import-linter 依赖契约（设计 4.3 / 10.5，CI 强制）
#   适配器不得 import 引擎内部（撮合/记账/绩效），协议对象除外
#   数据层不得反向依赖引擎层
# ============================================================
[tool.importlinter]
root_packages = ["mtzquant"]

[[tool.importlinter.contracts]]
name = "Adapters must not import engine internals (broker/account/metrics)"
type = "forbidden"
source_modules = ["mtzquant.adapters"]
forbidden_modules = [
    "mtzquant.engine.broker",
    "mtzquant.engine.account",
    "mtzquant.engine.metrics",
]

[[tool.importlinter.contracts]]
name = "Data layer must not import engine"
type = "forbidden"
source_modules = ["mtzquant.data"]
forbidden_modules = ["mtzquant.engine"]

[[tool.importlinter.contracts]]
name = "Research/ML must not import server"
type = "forbidden"
source_modules = ["mtzquant.research", "mtzquant.ml"]
forbidden_modules = ["mtzquant.server"]

[[tool.importlinter.contracts]]
name = "ML must not import engine (前瞻标签只存在于 ml 通道, M3-R4)"
type = "forbidden"
source_modules = ["mtzquant.ml"]
forbidden_modules = ["mtzquant.engine", "mtzquant.engine.*"]

[[tool.importlinter.contracts]]
name = "Backtest main chain must not import ML (前瞻标签不可进入回测主链路, M3-R4)"
type = "forbidden"
source_modules = ["mtzquant.engine", "mtzquant.adapters", "mtzquant.data", "mtzquant.store", "mtzquant.worker"]
forbidden_modules = ["mtzquant.ml"]
