<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtzQuant 回测监控</title>
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --line:#232c44; --fg:#d7e0f2; --muted:#8b96b0;
          --acc:#4c8dff; --green:#2ecc71; --red:#e74c3c; --yellow:#f1c40f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; background:var(--panel);
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  .muted { color:var(--muted); }
  #statusBadge { padding:2px 10px; border-radius:10px; font-size:12px; background:#26304a; }
  .s-completed_exact,.s-completed_degraded { background:#0f2e1d; color:var(--green); }
  .s-running { background:#1e2a44; color:var(--acc); }
  .s-error { background:#3a1616; color:var(--red); }
  .progress-wrap { flex:1 1 100%; margin-top:4px; }
  #bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  #barFill { height:100%; width:0%; background:linear-gradient(90deg,#2e6bff,#4c8dff); transition:width .3s; }
  #progText { font-size:12px; color:var(--muted); margin-top:3px; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:12px; padding:12px 20px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--muted); font-weight:600; }
  .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
  .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .metric .v { font-size:18px; font-weight:600; }
  .metric .l { font-size:11px; color:var(--muted); }
  .up { color:var(--green); } .down { color:var(--red); }
  #navChart { height:300px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #logs { height:150px; overflow:auto; font:11px/1.6 Consolas,monospace; color:var(--muted);
          white-space:pre-wrap; }
  .buy { color:var(--red); } .sell { color:var(--green); }
  #foot { padding:10px 20px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>mtzQuant 回测监控</h1>
  <span id="taskName" class="muted">—</span>
  <span id="runId" class="muted">—</span>
  <span id="statusBadge">connecting…</span>
  <div class="progress-wrap">
    <div id="bar"><div id="barFill"></div></div>
    <div id="progText">等待事件流…</div>
  </div>
</header>

<main>
  <div>
    <div class="metrics">
      <div class="metric"><div class="l">总收益</div><div class="v" id="m_total">—</div></div>
      <div class="metric"><div class="l">年化</div><div class="v" id="m_annual">—</div></div>
      <div class="metric"><div class="l">最大回撤</div><div class="v" id="m_dd">—</div></div>
      <div class="metric"><div class="l">夏普</div><div class="v" id="m_sharpe">—</div></div>
    </div>
    <div class="card">
      <h2>净值曲线（策略 vs 基准）</h2>
      <div id="navChart"></div>
    </div>
    <div class="card">
      <h2>成交（最近 20 笔）</h2>
      <table id="fills"><thead><tr><th>时间</th><th>代码</th><th>方向</th><th>价格</th><th>数量</th><th>金额</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>运行日志</h2>
      <div id="logs"></div>
    </div>
  </div>
</main>
<div id="foot">回测结束后可用 <code>mtzquant report &lt;run_id&gt;</code> 查看完整报告。</div>

<script src="/static/vendor/echarts.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = v => v==null ? "—" : (typeof v==="number" ? v.toLocaleString("zh-CN",{maximumFractionDigits:2}) : String(v));
const fmtPct = v => v==null ? "—" : (v*100).toFixed(2)+"%";
const fmtMoney = v => v==null ? "—" : (v/10000).toFixed(1)+"万";

// ---- 状态 ----
function setStatus(s){
  const b=$("statusBadge");
  b.textContent = s || "—";
  b.className = "s-"+s;
}
function setProgress(p){
  $("barFill").style.width = Math.round((p.percent||0)*100)+"%";
  const eta = p.eta_seconds>0 ? `，ETA ${Math.round(p.eta_seconds)}s` : "";
  $("progText").textContent =
    `第 ${(p.day_index||0)+1}/${p.total_days} 个交易日 · ${p.trade_date||""}` +
    ` · ${Math.round((p.percent||0)*100)}% · 已用 ${(p.elapsed_seconds||0).toFixed(1)}s${eta}`;
}

// ---- 净值曲线（增量 appendData, W0-5）----
let chart=null, navSeries=[], benchSeries=[], firstDaily=null, days=0;
const dailyRets=[];
function ensureChart(){
  if(chart) return chart;
  chart = echarts.init($("navChart"));
  chart.setOption({
    grid:{left:50,right:20,top:20,bottom:40},
    tooltip:{trigger:"axis"},
    legend:{data:["策略","基准"],textStyle:{color:"#8b96b0"}},
    xAxis:{type:"time",axisLabel:{color:"#8b96b0"}},
    yAxis:{type:"value",scale:true,axisLabel:{color:"#8b96b0"}},
    series:[
      {name:"策略",type:"line",showSymbol:false,data:[],lineStyle:{color:"#4c8dff"},itemStyle:{color:"#4c8dff"}},
      {name:"基准",type:"line",showSymbol:false,data:[],lineStyle:{color:"#8b96b0"},itemStyle:{color:"#8b96b0"}}
    ]
  });
  return chart;
}
function onDailyNav(d){
  days++;
  const t=new Date(d.trade_date+"T00:00:00+08:00").getTime();
  navSeries.push([t,d.nav]);
  if(d.benchmark_nav!=null) benchSeries.push([t,d.benchmark_nav]);
  if(firstDaily==null) firstDaily=d;
  const c=ensureChart();
  c.appendData({seriesIndex:0,data:[[t,d.nav]]});
  if(d.benchmark_nav!=null) c.appendData({seriesIndex:1,data:[[t,d.benchmark_nav]]});
  // 日收益（夏普用）
  if(navSeries.length>1){
    const prev=navSeries[navSeries.length-2][1], cur=navSeries[navSeries.length-1][1];
    dailyRets.push(cur/prev-1);
  }
  updateMetrics();
}
function updateMetrics(){
  const last=navSeries[navSeries.length-1];
  if(!last) return;
  const nav=last[1];
  const total=nav-1;
  const annual=Math.pow(nav, 252/Math.max(1,days))-1;
  const dd=(firstDaily&&firstDaily.drawdown!=null)?firstDaily.drawdown:0;
  let sharpe=null;
  if(dailyRets.length>2){
    const mean=dailyRets.reduce((a,b)=>a+b,0)/dailyRets.length;
    const varr=dailyRets.reduce((a,b)=>a+(b-mean)**2,0)/(dailyRets.length-1);
    const sd=Math.sqrt(varr);
    if(sd>0) sharpe=mean/sd*Math.sqrt(252);
  }
  $("m_total").textContent=fmtPct(total);
  $("m_total").className=total>=0?"v up":"v down";
  $("m_annual").textContent=fmtPct(annual);
  $("m_dd").textContent=fmtPct(dd);
  $("m_dd").className=dd<=0?"v down":"v";
  $("m_sharpe").textContent=sharpe==null?"—":sharpe.toFixed(2);
}

// ---- 成交表 / 日志 ----
const FILLS=[];
function onFill(d){
  FILLS.unshift(d);
  const tbody=$("fills").querySelector("tbody");
  tbody.innerHTML="";
  FILLS.slice(0,20).forEach(f=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${f.fill_time||""}</td><td>${f.code||""}</td>`+
      `<td class="${f.side}">${f.side||""}</td><td class="num">${fmt(f.price)}</td>`+
      `<td class="num">${fmt(f.volume)}</td><td class="num">${fmtMoney(f.amount)}</td>`;
    tbody.appendChild(tr);
  });
}
function onLog(d){
  const el=$("logs");
  const line=`[${new Date().toLocaleTimeString()}] ${JSON.stringify(d)}`;
  el.textContent = (el.textContent ? el.textContent+"\n" : "")+line;
  el.scrollTop=el.scrollHeight;
}

// ---- 事件分发（6.3 信封 {type,run_id,ts,event_seq,committed,data}）----
function handle(env){
  const t=env.type, d=env.data||{};
  switch(t){
    case "progress": setProgress(d); break;
    case "daily_nav": onDailyNav(d); break;
    case "fill": onFill(d); break;
    case "log": onLog(d); break;
    case "status": setStatus(d.status); break;
    default: break; // order_event / corp_action / metric 等不渲染（W0 单页裁剪）
  }
}

async function boot(){
  try{
    const r=await fetch("/api/runtime");
    const rt=await r.json();
    if(rt.run_id){ $("runId").textContent="run: "+rt.run_id; }
    if(rt.task_name){ $("taskName").textContent=rt.task_name; }
    if(rt.status!=="idle") setStatus(rt.status);
  }catch(e){ /* 无 runtime 时静默 */ }

  let ws;
  try{ ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/ws"); }
  catch(e){ setStatus("error"); return; }
  ws.onmessage = ev => { try{ handle(JSON.parse(ev.data)); }catch(e){ /* 忽略坏帧 */ } };
  ws.onclose = () => { setStatus("closed"); };
  ws.onerror = () => { setStatus("error"); };
  // 兜底重连（W0 简化: 单次; M4 补帧协议归 M4-W3）
}
boot();
</script>
</body>
</html>
